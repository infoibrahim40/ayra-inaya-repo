visual_style: Original polished stylized 3D animated children's cartoon, soft cinematic lighting, warm
  colors, expressive appealing faces, clean high-quality render, smooth materials, family-friendly.
avoid: text, letters, watermark, logo, extra characters, extra fingers or limbs, malformed hands, realistic
  human look, dark or horror mood, clutter, any existing cartoon character or style. Subtitles, flickering,
  unexplained prop changes, outfit changes between shots.
content_rules:
- No Prophet of Islam is ever depicted, voiced or portrayed in any form.
- No invented Quran verses, hadith or duas. Any religious quote needs a verified source.
- Worship and sacred places are shown respectfully, never as comedy.
- Inventions are fictional and safe, no real instructions.
